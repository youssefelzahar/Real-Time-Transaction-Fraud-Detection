# NilePay fraud API - Nginx reverse proxy / load balancer for 6 FastAPI instances.
# Runs as a normal user (no root): all paths are relative to the prefix `deploy/`.
#   nginx -p deploy/ -c nginx/nginx.conf -e run/error.log
# Started and stopped by deploy/start.sh and deploy/stop.sh.

worker_processes 2;
pid run/nginx.pid;
error_log run/error.log warn;

events {
    worker_connections 4096;
}

http {
    server_tokens off;

    # $upstream_addr records which instance served each request, so routing can be
    # verified from this log without adding anything to the public API response.
    # rt = total time in Nginx; upstream_rt = time the instance took; upstream_ct = TCP
    # connect time to the instance (0.000 when a pooled keepalive connection was reused).
    # rt - upstream_rt = time spent before/after the instance (e.g. waiting for a slot).
    log_format upstream '$remote_addr [$time_local] "$request" $status rt=$request_time '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'upstream_rt=$upstream_response_time upstream_ct=$upstream_connect_time';
    access_log run/access.log upstream buffer=64k flush=1s;

    client_body_temp_path run/tmp/body;
    proxy_temp_path       run/tmp/proxy;
    fastcgi_temp_path     run/tmp/fastcgi;
    uwsgi_temp_path       run/tmp/uwsgi;
    scgi_temp_path        run/tmp/scgi;

    upstream fraud_api {
        # Round-robin (default). Open-source Nginx has only PASSIVE health checks:
        # after max_fails failed attempts within fail_timeout an instance is skipped
        # for fail_timeout, then tried again. Nginx never calls /health on its own.
        # Connection errors AND timeouts count as failures (regardless of
        # proxy_next_upstream), so instances must never be pushed into overload:
        #
        # Load shedding: max_conns caps in-flight requests per instance. One worker
        # serves ~2,750 req/s; 64 in flight ~= 25 ms of queue (Little's law). Beyond
        # that, a single-worker uvicorn queues unfairly (p99 4-6 s at 200 concurrent),
        # requests hit proxy_read_timeout, the timeouts disable the instance and the
        # whole upstream cascades into "no live upstreams". With the cap, excess
        # requests get an immediate 503 (see error_page below) instead.
        zone fraud_api 64k;   # shared by all nginx workers, required for max_conns
        # Six instances, one uvicorn worker each. deploy/start.sh reads these ports,
        # so this list is the single source of truth for the instance layout.
        server 127.0.0.1:8001 max_conns=64 max_fails=3 fail_timeout=5s;   # instance 1
        server 127.0.0.1:8002 max_conns=64 max_fails=3 fail_timeout=5s;   # instance 2
        server 127.0.0.1:8003 max_conns=64 max_fails=3 fail_timeout=5s;   # instance 3
        server 127.0.0.1:8004 max_conns=64 max_fails=3 fail_timeout=5s;   # instance 4
        server 127.0.0.1:8005 max_conns=64 max_fails=3 fail_timeout=5s;   # instance 5
        server 127.0.0.1:8006 max_conns=64 max_fails=3 fail_timeout=5s;   # instance 6

        # Reuse connections to the instances instead of a new TCP handshake per request.
        # The pool is per Nginx worker and shared by all six instances: 64 was too
        # small at 100 concurrent (connection churn, p95 82 ms -> 51 ms with 256).
        keepalive 256;
        # Must be shorter than uvicorn's idle timeout (--timeout-keep-alive, 5 s).
        # Otherwise Nginx can reuse a connection the instance is closing, and that
        # already-sent POST fails with "connection reset by peer" (not retried).
        keepalive_timeout 4s;
    }

    server {
        listen 127.0.0.1:8080;

        # Transaction requests are small JSON bodies.
        client_max_body_size 16k;

        location / {
            proxy_pass http://fraud_api;

            # Required for upstream keepalive.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Scoring takes ~1 ms; anything slower than this is a failure, not a slow answer.
            proxy_connect_timeout 1s;
            proxy_send_timeout    2s;
            proxy_read_timeout    2s;

            # Retry on the other instance only on connection errors (refused / reset),
            # i.e. when the request was not delivered. `non_idempotent` is deliberately
            # NOT set: a POST /predict that reached an instance is never sent twice.
            # Timeouts are not retried: the scoring may already have happened.
            proxy_next_upstream         error;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 2s;

            # No instance available (all at max_conns, or all down) -> 503 with a
            # JSON body, so the payment service can apply its fallback decision.
            error_page 502 503 = @unavailable;

            # Instance accepted the request but did not answer within proxy_read_timeout
            # (hung or overloaded). Kept as 504, not 503: the transaction may already
            # have been scored, so the caller must not treat it as "safe to resend".
            error_page 504 = @timeout;
        }

        location @timeout {
            default_type application/json;
            return 504 '{"detail":"fraud scoring timed out"}';
        }

        location @unavailable {
            default_type application/json;
            add_header Retry-After 1 always;
            return 503 '{"detail":"fraud scoring temporarily unavailable"}';
        }
    }

    # Internal diagnostics only: connection counters for load/saturation testing.
    # Separate loopback port, not reachable through the public :8080 server.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
        location / {
            return 404;
        }
    }
}
