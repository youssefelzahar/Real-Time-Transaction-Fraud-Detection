# NilePay single-node Kafka (KRaft: broker + controller in one process, no ZooKeeper).
# Template: deploy/kafka.sh replaces @DATA_DIR@ and writes the result next to the data.
# Loopback only: nothing listens on a public interface.

process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093

listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=@DATA_DIR@/kraft-logs

# Topics are created explicitly by deploy/kafka.sh (no typo-created topics).
auto.create.topics.enable=false
num.partitions=6

# Single node: replication factor 1 everywhere (no redundancy, see KAFKA_EVENTS.md).
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
min.insync.replicas=1

log.retention.hours=168
log.segment.bytes=268435456
group.initial.rebalance.delay.ms=0
